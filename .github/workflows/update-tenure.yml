name: Update Player Tenure Data

permissions:
  contents: write

on:
  schedule:
    # Weekly on Mondays at 11:00 UTC (after potential weekend trades settle)
    - cron: '0 11 * * 1'
  workflow_dispatch:  # Manual trigger

jobs:
  update-tenure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # stats.nba.com does not answer GitHub's runners, so tenure is built
      # from nba-player-data's public rsStats.json (no packages needed).
      # update_tenure.py (the stats.nba.com version) stays for local runs.
      - name: Build tenure from nba-player-data
        run: python update_tenure_from_player_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tenure_data.json
          git diff --cached --quiet || git commit -m "Update tenure data $(date +%Y-%m-%d)"
          git push
