name: Update Player Tenure Data

permissions:
  contents: write

on:
  schedule:
    # Daily at 13:17 UTC: a few hours after nba-player-data's "Daily data
    # chain" (05:35 UTC, backup 09:47), which writes the box-score file and
    # often starts late. An unchanged box-score file means no commit.
    - cron: '17 13 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  update-tenure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # stats.nba.com does not answer GitHub's runners. Tenure now starts from
      # the Mar 20 2026 file (tenure_baseline_2025-26.json) and moves each
      # player on from his latest 2026-27 game in nba-player-data's box-score
      # build. No packages needed. update_tenure.py stays for local runs.
      - name: Update tenure from the 2026-27 box scores
        run: python update_tenure_from_box_scores.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tenure_data.json
          git diff --cached --quiet || git commit -m "Update tenure data $(date +%Y-%m-%d)"
          git push
